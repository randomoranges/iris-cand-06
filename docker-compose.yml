services:
  db:
    image: postgis/postgis:16-3.4
    container_name: iris_qa_db
    environment:
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris
      POSTGRES_DB: iris
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris -d iris"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - iris_qa_pgdata:/var/lib/postgresql/data

volumes:
  iris_qa_pgdata:
